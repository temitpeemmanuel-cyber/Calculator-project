  <style>

        width: 34px;

      }

      }

    @media (max-width: 480px) {

       position: relative;
       right: 20px;
      }

      position: relative;
      right: 20px;
      }
      button {
        width: 60px;
        height: 57px;
      }
      .container {
        justify-content: space-between;
        gap: 0;
        padding: 0 5px;
      }
      .icon-size {
        width: 30px;

      }

        gap: 8px;
      }
      #calculator {
        height: 750px;
      }
      .container {
        padding: 0 1px;
        margin-top: 50px;
      }
    }
  </style>
<body>
    <div id="calculator">
      <div class="split">

    </div><br><br><br>
    <div class="coll">

    <h1 id="display">0</h1>

    </div>
    
    <script>
      const cancellation = document.getElementById("cancellation");
      const answer = document.getElementById("answer");
      const display = document.getElementById("display");
      let number ="";
      let solve ="";
      let ans = "";
      let work= "";
      const seven = document.getElementById("seven");
      const eight = document.getElementById("eight");  
      const nine = document.getElementById("nine");
      const plus = document.getElementById("plus");

      const four = document.getElementById("four");
      const five = document.getElementById("five");
      const six = document.getElementById("six");
      const multiply = document.getElementById("multiply");

      const one = document.getElementById("one");
      const two = document.getElementById("two");
      const three = document.getElementById("three");
      const minus = document.getElementById("minus");

      const zero = document.getElementById("zero");
      const dot = document.getElementById("dot");
      const divide = document.getElementById("divide");
      const equals = document.getElementById("equals");

      seven.addEventListener("click", function () {
        number = number + "7";
        display.textContent= number;
      })
      eight.addEventListener("click", function () {
        number = number + "8";
        display.textContent= number;
      })
      nine.addEventListener("click", function () {
        number = number + "9";
        display.textContent= number;
      })
      plus.addEventListener("click", function () {
        solve = "+";
        number= number + "+";
        display.textContent= number;
      })

      four.addEventListener("click", function () {
        number = number + "4";
        display.textContent= number;
      })
      five.addEventListener("click", function () {
        number = number + "5";
        display.textContent= number;
      })
      six.addEventListener("click", function () {
        number = number + "6";
        display.textContent= number;
      })
      multiply.addEventListener("click", function () {
        solve =  "*";
        number = number + "*";
        display.textContent= number;
      })

      one.addEventListener("click", function () {
        number = number + "1";
        display.textContent= number;
      })
      two.addEventListener("click", function () {
        number = number + "2";
        display.textContent= number;
      })
      three.addEventListener("click", function () {
        number = number + "3";
        display.textContent= number;
      })
      minus.addEventListener("click", function () {
        solve = "-";
        number = number + "-";
        display.textContent= number;
      })

      zero.addEventListener("click", function () {
        number = number + "0";
        display.textContent = number;
      })
      dot.addEventListener("click", function () {
        number = number + ".";
        display.textContent= number;
      })
      divide.addEventListener("click", function () {
        solve =  "/";
        number = number + "/";
        display.textContent= number;
      })
      cancellation.addEventListener("click", function () {
        number = "";
        display.textContent = "0";
        answer.textContent = "=";
      })

      equals.addEventListener("click", function () { 
       if (solve === "+") {

    let ans = number.split("+");

    let result = 0;

    for (let i = 0; i < ans.length; i++) {
        result = result + Number(ans[i]);
    }

       answer.textContent = result;
  } 

       if (solve === "-") {

       let an = number.split("-");

        let result= Number(an[0]);

       for (let e = 1; e < an.length; e++) {
        result = result - Number(an[e]);
        }

       answer.textContent = result;
       }

       if (solve === "*" ) {
        let ans = number. split("*");
         
        let result = Number(ans[0]);

        for (let g = 1; g < ans.length; g++) {
          result = result * Number(ans[g]); 
        }
        answer.textContent= result;
       }

       if (solve === "/" ) {
        let ans = number. split("/");
        let result = Number(ans[0]);

      for (let p = 1; p < ans.length; p++) {
        result = result / Number(ans[p]);
      }
      answer.textContent= result;
       }

  
   // Put this inside your existing equals click

let numbers = [];
let operators = [];
let work = "";

// Go through the whole expression
for (let i = 0; i < number.length; i++) {

    if (
        number[i] === "+" ||
        number[i] === "-" ||
        number[i] === "*" ||
        number[i] === "/"
    ) {

        // Save the number we have collected
        numbers.push(Number(work));

        // Save the operator
        operators.push(number[i]);

        // Start collecting the next number
        work = "";

    } else {

        // Keep adding digits to the current number
        work = work + number[i];
    }
}

// Save the last number
numbers.push(Number(work));


// MULTIPLICATION AND DIVISION FIRST
for (let i = 0; i < operators.length; i++) {

    if (operators[i] === "*") {

        numbers[i] = numbers[i] * numbers[i + 1];

        numbers.splice(i + 1, 1);
        operators.splice(i, 1);

        i--;
    }

    else if (operators[i] === "/") {

        numbers[i] = numbers[i] / numbers[i + 1];

        numbers.splice(i + 1, 1);
        operators.splice(i, 1);

        i--;
    }
}


// ADDITION AND SUBTRACTION
let result = numbers[0];

for (let i = 0; i < operators.length; i++) {

    if (operators[i] === "+") {
        result = result + numbers[i + 1];
    }

    else if (operators[i] === "-") {
        result = result - numbers[i + 1];
    }
}

answer.textContent = result;

      })
